# Job Watch Configuration Example
# Copy this file to job_watch_config.yaml and edit it to match your preferences.
# This file serves as the single source of truth for the daily job monitor MVP.

# -----------------------------------------------------------------------------
# Target Roles
# -----------------------------------------------------------------------------
# Define the exact job roles you are looking for.
# The tool will dynamically build the report around these exact role names.
# You can use a simple string, or a dictionary to define aliases directly.
target_roles:
#   - name: "AI Engineer"
#     aliases:
#       - "Applied AI Engineer"
#       - "Generative AI Engineer"
  - name: "Forward Deployed Engineer"
    aliases:
      - "Forward Deployed Software Engineer"
      - "Forward Deployed AI Engineer"
      - "Deployment Strategist"
      - "Solutions Engineer"
      - "AI Solutions Engineer"
  - name: "Product Designer"
    aliases:
      - "UX Designer"
      - "Product Design"
      - "Interaction Designer"
  - name: "Frontend Engineer"
    aliases:
      - "Frontend Developer"
      - "Front End Engineer"
      - "React Engineer"

# (Optional) You can still define aliases here, but the inline format above is preferred.
role_aliases: {}

# -----------------------------------------------------------------------------
# Locations
# -----------------------------------------------------------------------------
# Define your target locations.
locations:
  - "New York, NY"
  - "New Jersey"

# Define aliases for your target locations.
location_aliases:
  "New York, NY":
    - "New York"
    - "NYC"
    - "Manhattan"
    - "Brooklyn"
  "New Jersey":
    - "Jersey City"
    - "Hoboken"
    - "Newark"
    # - "Princeton"

# -----------------------------------------------------------------------------
# Company Preferences
# -----------------------------------------------------------------------------
# Jobs at these companies will get a score boost (+20) and appear at the top.
preferred_companies:
  - "OpenAI"
  - "Anthropic"
  - "Perplexity"
  - "Palantir"
  - "Databricks"
  - "Figma"
  - "Notion"
  - "Meta"
  - "Google"
  - "Netflix"
  - "Amazon"
  - "Adobe"
  - "Airbnb"
  - "Uber"
  - "Spotify"

# Jobs from these companies will be entirely excluded from the report.
exclude_companies:
  - "Revature"
  - "Dice"
  - "DataAnnotation"

# -----------------------------------------------------------------------------
# Keyword Filters
# -----------------------------------------------------------------------------
# Finding these keywords in the job title or description adds a score boost (+5 each).
include_keywords:
  - "AI"
  - "LLM"
  - "machine learning"
  - "generative AI"
  - "product design"
  - "design systems"
  - "Figma"
  - "React"
  - "TypeScript"
  - "frontend"
  - "prototype"
  - "human-centered"
  - "user experience"

# Finding ANY of these keywords in the job title or description will exclude the job.
exclude_keywords:
  - "Senior Director"
  - "Director"
  - "VP"
  - "Principal"
  - "Staff"
  - "10+ years"
  - "12+ years"
  - "Security Clearance"
  - "US Citizen required"
  - "Senior"
  - "Manager"
  - "Lead"
  - "Staff"

