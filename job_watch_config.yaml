# -----------------------------------------------------------------------------
# Match Preferences
# -----------------------------------------------------------------------------
preferences:
  remote:
    include_remote: true
    include_hybrid: true
    include_onsite: true
  seniority:
    include_internship: false
    include_entry_level: true
    include_mid_level: true
    include_senior: false
  max_years_of_experience: 3
  # Jobs scoring below this threshold will be excluded from the final report.
  # Target role match = +30, Target location match = +20
  minimum_match_score: 40
  # Maximum number of jobs to include in the generated report.
  max_jobs_in_report: 50

# -----------------------------------------------------------------------------
# Scraping Configuration
# -----------------------------------------------------------------------------
scrape:
  sites:
    - "linkedin"
  # Target number of results per role+location pair to fetch from the provider.
  results_wanted: 30
  # Only fetch jobs posted within the last N hours.
  hours_old: 24
  # If true, skips records where the job description cannot be fetched.
  require_description: true

# -----------------------------------------------------------------------------
# Output Reporting
# -----------------------------------------------------------------------------
report:
  # Output directory relative to the repository root.
  output_dir: "reports/daily"
  # Number of days of historical jobs to include in the market analysis.
  lookback_days: 3
  # Format of the report. Currently 'markdown' is supported.
  format: "markdown"
  # Include an optional historical changes section when data permits
  include_role_history_changes: false

# -----------------------------------------------------------------------------
# Email Configuration (Optional)
# -----------------------------------------------------------------------------
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""  # Leave blank to use JOBWATCH_EMAIL_USER env var
  sender_email: ""
  recipient_email: ""
  subject_prefix: "Daily Job Watch Report"

# -----------------------------------------------------------------------------
# AI Summary Configuration (Legacy — kept for backward compatibility)
# -----------------------------------------------------------------------------
ai_summary:
  enabled: false
  provider: "openai"
  model: "gpt-4o-mini"
  # Maximum number of top jobs to send to the AI for summarization.
  max_jobs: 20

# -----------------------------------------------------------------------------
# AI Analysis Configuration (Incremental Intelligence)
# -----------------------------------------------------------------------------
# Supports Gemini and OpenAI. Set API keys in .env:
#   JOBWATCH_GEMINI_API_KEY=your-key
#   JOBWATCH_OPENAI_API_KEY=your-key
# Install AI dependencies: uv sync --extra ai
ai_analysis:
  enabled: true
  provider: "gemini"         # "gemini" or "openai"
  model: "gemini-2.5-flash"  # default fallback model
  extraction_model: ""       # e.g., gemini-2.5-flash
  synthesis_model: ""        # e.g., gemini-2.5-pro
  fallback_to_rules: true    # Use rule-based analysis if AI fails
  analyze_new_jobs: true
  analyze_updated_jobs: true
  analyze_unchanged_jobs: true
  generate_comparative_summary: true
  max_jobs_per_run: 30
  max_description_chars: 12000
  cache_results: true
  temperature: 0.2

# -----------------------------------------------------------------------------
# Rule-Based Analysis Configuration
# -----------------------------------------------------------------------------
analysis:
  enabled: true
  dedupe_by_url: true
  show_match_scores: false
  include_raw_description_excerpt: false
  raw_description_excerpt_chars: 500
  top_keywords_limit: 30
  max_examples_per_keyword: 3
  max_examples_per_trend: 5
  trend_analysis:
    min_current_jobs: 5
    min_previous_jobs: 5
    min_percentage_point_change: 10.0
